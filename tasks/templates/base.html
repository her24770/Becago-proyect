<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BecaGo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">BecaGo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="/" class="nav-link active" aria-current="page">Home</a>
                    </li>

                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a href="/tasks" class="nav-link active" aria-current="page">Actividades</a>
                    </li>
                    <li class="nav-item">
                        <a href="/mis-tareas" class="nav-link active" aria-current="page">Inscritas</a>
                    </li>
                    <li class="nav-item">
                        <a href="/resumen" class="nav-link active" aria-current="page">Resumen</a>
                    </li>
                    <li class="nav-item">
                        <a href="/logout" class="nav-link active" aria-current="page">Logout</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="{{ user.profile.profile_image.url }}" alt="User Image" style="width: 30px; height: 30px; border-radius: 50%;">
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><h6 class="dropdown-item">{{ user.username }}</h6></li>
                            <li><a class="dropdown-item" href="/update_profile">Actualizar Perfil</a></li>
                        </ul>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a href="/signup" class="nav-link active" aria-current="page">Signup</a>
                    </li>
                    <li class="nav-item">
                        <a href="/signin" class="nav-link active" aria-current="page">Singin</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
