{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'task/signup.css' %}">
<main class="register-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <form method="POST" class="register-card card card-body">
                    <h1 class="becago">BecaGo UVG</h1>
                    <h3 class="register-title">Registrarse</h3>
                    
                    {{error}}
                    
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="username" class="form-label">Nombre de usuario</label>
                        <input type="text" name="username" id="username" 
                               class="form-control form-input" 
                               placeholder="Crea tu nombre de usuario">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password1" class="form-label">Contraseña</label>
                        <input type="password" name="password1" id="password1" 
                               class="form-control form-input" 
                               placeholder="Crea tu contraseña">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password2" class="form-label">Confirmar contraseña</label>
                        <input type="password" name="password2" id="password2" 
                               class="form-control form-input" 
                               placeholder="Confirma tu contraseña">
                    </div>
                    
                    <button class="btn btn-primary register-btn">
                        Crear cuenta
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
